<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Report is Ready | The 100k Parent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F7FAFC; color: #2D3748; min-height: 100vh; }

        .nav { background: white; border-bottom: 1px solid #E2E8F0; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-size: 1.25rem; font-weight: 800; color: #2E5C8A; text-decoration: none; }
        .nav-back { font-size: 0.875rem; color: #4A90E2; text-decoration: none; font-weight: 600; }

        .container { max-width: 700px; margin: 0 auto; padding: 3rem 1.5rem; }

        .success-icon { width: 80px; height: 80px; background: #10B981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2.5rem; }

        h1 { text-align: center; font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #718096; font-size: 1.0625rem; margin-bottom: 2.5rem; }

        .card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }

        .card-header { display: flex; align-items: center; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 2px solid #E2E8F0; margin-bottom: 1.5rem; }
        .card-icon { width: 50px; height: 50px; background: #4A90E2; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .card-title { font-weight: 800; font-size: 1.125rem; }
        .card-sub { color: #718096; font-size: 0.875rem; margin-top: 2px; }

        .saving-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #F7FAFC; }
        .saving-row:last-of-type { border-bottom: none; }
        .saving-label { font-weight: 600; font-size: 0.9375rem; }
        .saving-desc { font-size: 0.8125rem; color: #A0AEC0; margin-top: 2px; }
        .saving-amount { font-weight: 800; color: #10B981; font-size: 1.25rem; white-space: nowrap; }
        .saving-amount.zero { color: #CBD5E0; }

        .total-box { background: linear-gradient(135deg, #4A90E2, #2E5C8A); border-radius: 16px; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; color: white; }
        .total-label { font-weight: 700; font-size: 1rem; opacity: 0.9; }
        .total-range { font-size: 0.8125rem; opacity: 0.7; margin-top: 4px; }
        .total-amount { font-size: 2.5rem; font-weight: 800; }

        .download-btn { display: block; width: 100%; background: #10B981; color: white; border: none; border-radius: 14px; padding: 1.125rem; font-size: 1.125rem; font-weight: 700; cursor: pointer; text-align: center; margin: 1.5rem 0 0.75rem; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .download-btn:hover { background: #059669; transform: translateY(-1px); }
        .download-btn:disabled { background: #A0AEC0; transform: none; cursor: not-allowed; }
        @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(16,185,129,0); } }

        .download-note { text-align: center; font-size: 0.8125rem; color: #A0AEC0; margin-bottom: 1.5rem; }

        .tier-badge { display: inline-block; padding: 0.25rem 0.875rem; border-radius: 20px; font-size: 0.8125rem; font-weight: 700; margin-bottom: 1rem; }
        .tier-badge.essential { background: #E8F4F8; color: #2E5C8A; }
        .tier-badge.complete { background: #4A90E2; color: white; }

        .advisor-box { background: #F0EDFF; border-radius: 14px; padding: 1.5rem; margin-top: 1rem; }
        .advisor-box h3 { color: #7B68EE; margin-bottom: 0.5rem; font-size: 1rem; }
        .advisor-box p { color: #4A5568; font-size: 0.9375rem; line-height: 1.6; }
        .advisor-btn { display: inline-block; background: #7B68EE; color: white; padding: 0.75rem 1.5rem; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 1rem; font-size: 0.9375rem; }

        .no-results { text-align: center; padding: 3rem; }
        .no-results p { color: #718096; margin-bottom: 1.5rem; }
        .no-results a { background: #4A90E2; color: white; padding: 0.875rem 2rem; border-radius: 12px; text-decoration: none; font-weight: 700; }

        @media (max-width: 600px) {
            h1 { font-size: 1.625rem; }
            .total-amount { font-size: 2rem; }
            .container { padding: 2rem 1.25rem; }
        }

        /* Loading state */
        .loading { text-align: center; padding: 4rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid #E2E8F0; border-top-color: #4A90E2; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── PROGRESS BAR ── */
        .pdf-progress-wrap {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 1.75rem;
            margin: 1.5rem 0 0.75rem;
            display: none;
            box-shadow: 0 4px 20px rgba(74,144,226,0.1);
        }
        .pdf-progress-wrap.visible { display: block; }
        .pdf-progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .pdf-progress-text {
            font-size: 1rem;
            font-weight: 700;
            color: #2D3748;
        }
        .pdf-progress-pct {
            font-size: 1.25rem;
            font-weight: 800;
            color: #4A90E2;
            min-width: 3rem;
            text-align: right;
        }
        .pdf-progress-bar {
            height: 12px;
            background: #EDF2F7;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 0.875rem;
        }
        .pdf-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4A90E2, #7B68EE);
            border-radius: 99px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pdf-progress-step {
            font-size: 0.875rem;
            color: #718096;
            min-height: 1.4em;
            transition: opacity 0.3s;
        }
        .pdf-progress-steps-row {
            display: flex;
            justify-content: space-between;
            margin-top: 0.875rem;
            gap: 0.25rem;
        }
        .pdf-step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E2E8F0;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .pdf-step-dot.done { background: #4A90E2; }

        /* ── POPUP WARNING ── */
        .popup-warning {
            background: #FEF3C7;
            border: 2px solid #F59E0B;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: 1rem 0;
            display: none;
        }
        .popup-warning.visible { display: block; }
        .popup-warning-title {
            font-weight: 700;
            font-size: 0.9375rem;
            color: #92400E;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .popup-warning p {
            font-size: 0.875rem;
            color: #78350F;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        .popup-warning p:last-child { margin-bottom: 0; }
        .popup-warning strong { color: #92400E; }

        /* ── BLOCKED FALLBACK ── */
        .blocked-fallback {
            background: #FEE2E2;
            border: 2px solid #EF4444;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: 1rem 0;
            display: none;
        }
        .blocked-fallback.visible { display: block; }
        .blocked-fallback-title {
            font-weight: 700;
            font-size: 0.9375rem;
            color: #991B1B;
            margin-bottom: 0.5rem;
        }
        .blocked-fallback p {
            font-size: 0.875rem;
            color: #7F1D1D;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        .blocked-fallback ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .blocked-fallback li {
            font-size: 0.875rem;
            color: #7F1D1D;
            margin-bottom: 0.375rem;
        }
        .retry-btn {
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #DC2626; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="v2.html" class="nav-logo">The 100k Parent</a>
    <a href="v2.html#calculator" class="nav-back">← Back to Calculator</a>
</nav>

<div class="container" id="mainContent">
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p style="color: #718096;">Preparing your report...</p>
    </div>
</div>

<script>
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    const tier = params.get('tier') || 'essential';
    const tierLabel = tier === 'complete' ? 'Complete Guide' : 'Essential Report';
    const tierPrice = tier === 'complete' ? '£49' : '£19';

    // Read calculator results from localStorage
    const stored = localStorage.getItem('100kp_results');
    const r = stored ? JSON.parse(stored) : null;

    const main = document.getElementById('mainContent');

    if (!r) {
        // No results — send them back to calculator
        main.innerHTML = `
            <div class="no-results">
                <div class="success-icon" style="background: #F59E0B;">⚠️</div>
                <h1>No calculator results found</h1>
                <p>Please complete the savings calculator first so we can personalise your report.</p>
                <a href="v2.html#calculator">Go to Calculator</a>
            </div>`;
    } else {
        const avg = Math.round((r.minSaving + r.maxSaving) / 2);

        main.innerHTML = `
            <div class="success-icon">🎉</div>
            <h1>Your report is ready</h1>
            <p class="subtitle">Your personalised childcare savings report based on your family details</p>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">📄</div>
                    <div>
                        <div class="tier-badge ${tier}">${tierLabel} — ${tierPrice}</div>
                        <div class="card-title">Your Childcare Savings Report</div>
                        <div class="card-sub">The 100k Parent &bull; 2025/26 &bull; Personalised for your family</div>
                    </div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Tax-Free Childcare</div>
                        <div class="saving-desc">20% government top-up on eligible costs</div>
                    </div>
                    <div class="saving-amount ${r.tfc === 0 ? 'zero' : ''}">£${Math.round(r.tfc).toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Salary Sacrifice</div>
                        <div class="saving-desc">Income Tax + National Insurance savings</div>
                    </div>
                    <div class="saving-amount ${r.salary === 0 ? 'zero' : ''}">£${Math.round(r.salary).toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Income Splitting</div>
                        <div class="saving-desc">Optimising income across tax bands</div>
                    </div>
                    <div class="saving-amount ${r.splitting === 0 ? 'zero' : ''}">£${Math.round(r.splitting).toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">30 Hours Free Childcare</div>
                        <div class="saving-desc">Government-funded nursery hours</div>
                    </div>
                    <div class="saving-amount ${r.thirtyHours === 0 ? 'zero' : ''}">£${Math.round(r.thirtyHours).toLocaleString()}</div>
                </div>

                <div class="total-box">
                    <div>
                        <div class="total-label">Your estimated annual saving</div>
                        <div class="total-range">Range: £${Math.round(r.minSaving).toLocaleString()} — £${Math.round(r.maxSaving).toLocaleString()}</div>
                    </div>
                    <div class="total-amount">£${avg.toLocaleString()}</div>
                </div>

                <button class="download-btn" id="downloadBtn" onclick="downloadPDF()">
                    ⬇️ Download Your PDF Report
                </button>

                <!-- Popup warning — shown before PDF opens -->
                <div class="popup-warning" id="popupWarning">
                    <div class="popup-warning-title">⚠️ Allow the pop-up to download your report</div>
                    <p>Your PDF opens in a new tab. Your browser may block it — look for a <strong>pop-up blocked</strong> notification in your address bar and click <strong>Allow</strong>.</p>
                    <p>On mobile, tap <strong>Allow</strong> if prompted, or use the button below if nothing opens.</p>
                </div>

                <!-- Progress bar -->
                <div class="pdf-progress-wrap" id="progressWrap">
                    <div class="pdf-progress-label">
                        <span class="pdf-progress-text" id="progressText">Preparing your report</span>
                        <span class="pdf-progress-pct" id="progressPct">0%</span>
                    </div>
                    <div class="pdf-progress-bar">
                        <div class="pdf-progress-fill" id="progressFill"></div>
                    </div>
                    <div class="pdf-progress-step" id="progressStep">Starting...</div>
                    <div class="pdf-progress-steps-row">
                        <div class="pdf-step-dot" id="dot0"></div>
                        <div class="pdf-step-dot" id="dot1"></div>
                        <div class="pdf-step-dot" id="dot2"></div>
                        <div class="pdf-step-dot" id="dot3"></div>
                        <div class="pdf-step-dot" id="dot4"></div>
                        <div class="pdf-step-dot" id="dot5"></div>
                    </div>
                </div>

                <!-- Blocked fallback -->
                <div class="blocked-fallback" id="blockedFallback">
                    <div class="blocked-fallback-title">🚫 Pop-up blocked — here's how to fix it</div>
                    <p>Your browser blocked the PDF from opening. To allow it:</p>
                    <ol>
                        <li>Look at the top of your browser for a <strong>pop-up blocked</strong> icon</li>
                        <li>Click it and select <strong>Always allow pop-ups from this site</strong></li>
                        <li>Then click the button below to try again</li>
                    </ol>
                    <p>Or on iPhone/Safari: Settings → Safari → Block Pop-ups → turn off</p>
                    <button class="retry-btn" onclick="retryPDF()">Try Again</button>
                </div>

                ${tier === 'complete' ? `
                <div class="advisor-box">
                    <h3>📞 Your 30-Minute Advisor Call</h3>
                    <p>As a Complete Guide customer, you have a free call with our childcare savings advisor included. They will review your situation and help you implement the strategies.</p>
                    <a href="https://calendly.com/the100kparent" target="_blank" class="advisor-btn">Book Your Call</a>
                </div>` : ''}
            </div>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="v2.html#calculator" style="color: #4A90E2; font-size: 0.875rem; text-decoration: none; font-weight: 600;">← Recalculate with different figures</a>
            </div>`;

        // Auto-trigger PDF download after short delay
        // Auto-trigger handled by startPDFGeneration above
    }

    function downloadPDF() {
        const stored = localStorage.getItem('100kp_results');
        if (!stored) {
            alert('Please fill in the calculator first, then come back here.');
            return;
        }

        const r = JSON.parse(stored);

        // Show progress bar IMMEDIATELY so screen doesn't freeze
        showProgressBar();
        setProgress(10, 'Loading your data...');

        // Use requestAnimationFrame to let the browser paint the progress bar
        // before we do the heavy work
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setProgress(25, 'Building your profile...');

                setTimeout(() => {
                    setProgress(50, 'Calculating your strategies...');

                    setTimeout(() => {
                        setProgress(75, 'Writing your action plan...');

                        setTimeout(() => {
                            setProgress(90, 'Opening your report...');

                            // NOW build the HTML — after UI has painted
                            const html = generatePDFHTML(r, tier);

                            // Open new window
                            const win = window.open('', '_blank');

                            if (!win || win.closed || typeof win.closed === 'undefined') {
                                document.getElementById('blockedFallback').classList.add('visible');
                                document.getElementById('popupWarning').classList.remove('visible');
                                document.getElementById('progressWrap').classList.remove('visible');
                                document.getElementById('downloadBtn').disabled = false;
                                document.getElementById('downloadBtn').textContent = '⬇️ Try Again';
                                return;
                            }

                            // Write HTML to new tab
                            win.document.write(html);
                            win.document.close();

                            // Trigger print after fonts load
                            setTimeout(() => {
                                try { win.focus(); win.print(); } catch(e) {}
                                setProgress(100, '✅ Done! In the new tab — save as PDF.');
                                document.getElementById('downloadBtn').textContent = '⬇️ Download Again';
                                document.getElementById('downloadBtn').disabled = false;
                                document.getElementById('popupWarning').classList.remove('visible');
                            }, 1500);

                        }, 400);
                    }, 400);
                }, 400);
            });
        });
    }

    function retryPDF() {
        document.getElementById('blockedFallback').classList.remove('visible');
        downloadPDF();
    }

    function showProgressBar() {
        const btn = document.getElementById('downloadBtn');
        btn.disabled = true;
        btn.textContent = 'Preparing...';
        document.getElementById('popupWarning').classList.add('visible');
        document.getElementById('progressWrap').classList.add('visible');
        setProgress(0, 'Starting...');
    }

    function setProgress(pct, step) {
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct + '%';
        document.getElementById('progressStep').textContent = step;
        for (let i = 0; i < 6; i++) {
            const dot = document.getElementById('dot' + i);
            if (dot) dot.classList.toggle('done', pct >= (i + 1) * 17);
        }
        if (pct === 100) {
            document.getElementById('progressText').textContent = 'Report ready!';
            document.getElementById('progressFill').style.background = 'linear-gradient(90deg, #10B981, #059669)';
            for (let i = 0; i < 6; i++) {
                const dot = document.getElementById('dot' + i);
                if (dot) { dot.classList.add('done'); dot.style.background = '#10B981'; }
            }
        }
    }

    // Pulse button on load
    setTimeout(() => {
        const btn = document.getElementById('downloadBtn');
        if (btn) btn.style.animation = 'pulse 1.5s ease-in-out 2';
    }, 800);

    function generatePDFHTML(r, tier) {
        const avg = Math.round((r.minSaving + r.maxSaving) / 2);
        const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        const tierLabel = tier === 'complete' ? 'Complete Guide' : 'Essential Report';
        const taxYear = '2025/26';

        // ── PERSONA DETECTION ──────────────────────────────────────────────
        const income1 = r.income1 || 0;
        const income2 = r.income2 || 0;
        const higherIncome = Math.max(income1, income2);
        const lowerIncome = Math.min(income1, income2 > 0 ? income2 : income1);
        const hasPartner = income2 > 0;
        const monthlyChildcare = r.monthlyChildcare || 0;
        const annualChildcare = monthlyChildcare * 12;
        const ages = r.ages || [];
        const numChildren = r.numChildren || 1;

        // Income scenarios
        const isJustOver100k = higherIncome > 100000 && higherIncome <= 115000;
        const isWellOver100k = higherIncome > 115000 && higherIncome <= 149000;
        const isHighEarner = higherIncome > 149000;
        const isUnder100k = higherIncome < 100000;
        const isNearThreshold = higherIncome >= 90000 && higherIncome <= 105000;
        const partnerNearThreshold = income2 > 0 && income2 >= 90000 && income2 <= 105000;
        const isDirector = r.employment === 'director' || r.employment2 === 'director';
        const isSelfEmployed = r.employment === 'self-employed' && (!income2 || r.employment2 === 'self-employed');

        // Child scenarios
        const hasUnder2 = ages.some(a => a === 0 || a === 1);
        const hasUnder5 = ages.some(a => a >= 0 && a <= 4);
        const hasSchoolAge = ages.some(a => a >= 5);
        const eligibleFor30hrs = r.has30Hours;
        const eligibleForTFC = !r.over100k;

        // Salary sacrifice amount needed to get under £100k
        const sacrificeNeeded = higherIncome > 100000 ? higherIncome - 99999 : 0;
        const sacrificeNeededPartner = income2 > 100000 ? income2 - 99999 : 0;

        // 60% trap zone
        const in60TrapZone = higherIncome > 100000 && higherIncome <= 125140;
        const personalAllowanceLost = in60TrapZone ? Math.min(12570, Math.round((higherIncome - 100000) / 2)) : 0;
        const personalAllowanceTaxCost = Math.round(personalAllowanceLost * 0.40);

        // Child Benefit
        const cbPerChild = numChildren === 1 ? 1331 : numChildren === 2 ? 1331 + 881 : 1331 + (numChildren - 1) * 881;
        const hicbcApplies = higherIncome > 60000;
        const hicbcThreshold = 60000;
        const hicbcRate = higherIncome > 80000 ? 1.0 : Math.min(1.0, (higherIncome - 60000) / 20000);
        const hicbcCharge = Math.round(cbPerChild * hicbcRate);
        const cbNetBenefit = cbPerChild - hicbcCharge;

        // Pension sacrifice tax efficiency
        const sacrificeTaxRate = higherIncome > 100000 && higherIncome <= 125140 ? 0.62 : higherIncome > 50270 ? 0.42 : 0.32;

        // IFS figure — need £149k to match £99,999 disposable with 2 nursery kids
        const ifsComparison = higherIncome > 100000 && hasUnder5;

        // ── DYNAMIC PERSONA INTRO ────────────────────────────────────────
        let personaTitle, personaDesc, urgencyLevel, urgencyColor;
        if (isJustOver100k && hasUnder5) {
            personaTitle = 'You\'re in the most actionable position';
            personaDesc = `With income just over £100,000 and young children in childcare, you are leaving significant money on the table right now. A pension contribution of £${sacrificeNeeded.toLocaleString()} would bring your adjusted net income to £99,999 — unlocking Tax-Free Childcare and 30 hours free childcare worth potentially £${(Math.round(r.tfc) + Math.round(r.thirtyHours)).toLocaleString()} per year.`;
            urgencyLevel = '🔴 Act Before April';
            urgencyColor = '#DC2626';
        } else if (isWellOver100k && hasUnder5) {
            personaTitle = 'The 60% tax trap is costing you more than you realise';
            personaDesc = `Earners between £100,000 and £125,140 face an effective marginal tax rate of 60% — and with young children, the combined cost of the personal allowance taper AND lost childcare is enormous. The IFS estimates you need to earn £149,000 to have the same disposable income as someone on £99,999 with two nursery-age children.`;
            urgencyLevel = '🔴 High Priority';
            urgencyColor = '#DC2626';
        } else if (isHighEarner) {
            personaTitle = 'Tax efficiency and wealth building are your priorities';
            personaDesc = `At your income level, childcare cost reduction is one part of a broader tax efficiency picture. Income splitting, director structures, pension maximisation and investment wrappers all work together to build long-term family wealth alongside reducing childcare costs.`;
            urgencyLevel = '🟡 Strategic Planning';
            urgencyColor = '#D97706';
        } else if (isUnder100k && hasUnder5) {
            personaTitle = 'You qualify for full government childcare support';
            personaDesc = `Good news — with income below £100,000, you qualify for all available government childcare schemes. The key is making sure you're claiming everything you're entitled to and not leaving free money unclaimed.`;
            urgencyLevel = '🟢 Claim What\'s Yours';
            urgencyColor = '#059669';
        } else {

  .total-label { font-size: 14px; font-weight: 600; opacity: 0.9; }
  .total-range { font-size: 11px; opacity: 0.7; margin-top: 3px; }
  .total-amount { font-size: 38px; font-weight: 800; }
  .ifs-callout { background: #FFFBEB; border: 1px solid #FCD34D; border-radius: 12px; padding: 14px 18px; margin-top: 12px; font-size: 13px; color: #78350F; }

  /* STRATEGY CARDS */
  .strategy-card { border: 2px solid #E2E8F0; border-radius: 14px; margin-bottom: 20px; overflow: hidden; page-break-inside: avoid; }
  .strategy-card.priority { border-color: #4A90E2; }
  .strategy-card.locked { border-color: #FCA5A5; background: #FFF5F5; }
  .strategy-header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: #F7FAFC; border-bottom: 1px solid #E2E8F0; }
  .strategy-card.priority .strategy-header { background: #EBF5FF; }
  .strategy-card.locked .strategy-header { background: #FFF5F5; }
  .strategy-icon { font-size: 24px; flex-shrink: 0; }
  .strategy-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: #E8F4F8; color: #2E5C8A; margin-top: 4px; }
  .strategy-badge.red { background: #FEE2E2; color: #991B1B; }
  .strategy-badge.amber { background: #FEF3C7; color: #92400E; }
  .strategy-badge.blue { background: #DBEAFE; color: #1E40AF; }
  .strategy-saving { margin-left: auto; font-size: 22px; font-weight: 800; color: #10B981; text-align: right; flex-shrink: 0; }
  .strategy-saving span { font-size: 13px; font-weight: 400; color: #718096; display: block; }
  .strategy-saving.red { color: #EF4444; }
  .strategy-body { padding: 18px 20px; }
  .strategy-body p { margin-bottom: 14px; color: #4A5568; line-height: 1.7; }

  /* BREAKDOWN TABLE */
  .strategy-breakdown { background: #F7FAFC; border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #E2E8F0; font-size: 13px; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row.total { font-weight: 700; padding-top: 10px; margin-top: 4px; border-top: 2px solid #CBD5E0; border-bottom: none; }
  .breakdown-val { font-weight: 600; color: #2D3748; }
  .breakdown-val.green { color: #10B981; }
  .breakdown-val.red { color: #EF4444; }

  /* ACTION BOXES */
  .action-box { background: #E8F4F8; border-left: 4px solid #4A90E2; border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 10px 0; font-size: 13px; color: #2D3748; line-height: 1.6; }
  .action-box.blue { background: #DBEAFE; border-color: #3B82F6; }
  .alert-box { border-radius: 10px; padding: 12px 16px; margin: 10px 0; font-size: 13px; line-height: 1.6; }
  .alert-box.amber { background: #FFFBEB; border: 1px solid #FCD34D; color: #78350F; }
  .alert-box.red { background: #FFF5F5; border: 1px solid #FCA5A5; color: #7F1D1D; }

  /* NEXT STEPS */
  .step-item { display: flex; gap: 16px; margin-bottom: 20px; page-break-inside: avoid; }
  .step-num { width: 32px; height: 32px; background: #4A90E2; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
  .step-text h3 { font-size: 15px; margin-bottom: 6px; color: #2E5C8A; }
  .step-text p { font-size: 13px; color: #4A5568; line-height: 1.7; }

  /* ELIGIBILITY GRID */
  .elig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .elig-item { border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
  .elig-item.yes { background: #D1FAE5; }
  .elig-item.no { background: #FEE2E2; }
  .elig-text { font-size: 13px; font-weight: 600; }
  .elig-sub { font-size: 11px; color: #718096; margin-top: 2px; }

  /* DISCLAIMER / FOOTER */
  .disclaimer { background: #FFFBEB; border-left: 4px solid #F59E0B; padding: 14px 18px; border-radius: 0 8px 8px 0; margin-top: 24px; font-size: 12px; color: #78350F; }
  .report-footer { text-align: center; padding: 32px 50px; background: #F7FAFC; border-top: 2px solid #E2E8F0; }
  .footer-logo { font-size: 18px; font-weight: 800; color: #2E5C8A; margin-bottom: 6px; }
  .footer p { font-size: 11px; color: #A0AEC0; }

  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>

<!-- COVER PAGE -->
<div class="cover">
  <div class="cover-logo">The 100k Parent</div>
  <div>
    <div>
      <span class="cover-badge">${tierLabel}</span>
      <span class="cover-urgency">${urgencyLevel}</span>
    </div>
    <h1 class="cover-title">Your Personalised<br>Childcare Savings Report</h1>
    <p class="cover-subtitle">Tailored to your income, family setup and childcare situation — with specific numbers and actions for you.</p>

    <div class="cover-persona">
      <h3>${personaTitle}</h3>
      <p>${personaDesc}</p>
    </div>

    <div class="cover-saving-box">
      <div class="cover-saving-label">Your estimated annual saving</div>
      <div class="cover-saving-amount">£${avg.toLocaleString()}</div>
      <div class="cover-range">Range: £${Math.round(r.minSaving).toLocaleString()} — £${Math.round(r.maxSaving).toLocaleString()} per year</div>
    </div>
  </div>
  <div class="cover-meta">
    <p>Prepared for your family &bull; ${date} &bull; Tax year ${taxYear}</p>
    <p>The 100k Parent | the100kparent.com</p>
  </div>
</div>

<!-- PAGE 2: YOUR PROFILE & SUMMARY -->
<div class="page">
  <div class="page-header"><div class="page-logo">The 100k Parent</div><div class="page-num">Your Profile & Summary</div></div>

  <h2>Your Family Profile</h2>
  <p class="intro">Your report is built on these figures. If anything has changed, recalculate at the100kparent.com/v2.</p>

  <div class="profile-grid">
    <div class="profile-item"><div class="profile-label">Your Income</div><div class="profile-value">£${income1.toLocaleString()}</div></div>
    ${hasPartner ? `<div class="profile-item"><div class="profile-label">Partner's Income</div><div class="profile-value">£${income2.toLocaleString()}</div></div>` : `<div class="profile-item"><div class="profile-label">Household</div><div class="profile-value">Single income</div></div>`}
    <div class="profile-item"><div class="profile-label">Employment</div><div class="profile-value" style="text-transform:capitalize">${r.employment?.replace('-',' ')}</div></div>
    <div class="profile-item"><div class="profile-label">Children</div><div class="profile-value">${numChildren} (ages: ${ages.join(', ')})</div></div>
    <div class="profile-item"><div class="profile-label">Monthly Childcare</div><div class="profile-value">£${monthlyChildcare.toLocaleString()}</div></div>
    <div class="profile-item"><div class="profile-label">Annual Childcare</div><div class="profile-value">£${annualChildcare.toLocaleString()}</div></div>
  </div>

  <h2 style="margin-top:8px;">Savings Summary</h2>
  <div class="summary-row ${r.tfc > 0 ? 'available' : 'locked'}">
    <div><div class="summary-label">Tax-Free Childcare</div><div class="summary-desc">20% government top-up, max £2,000/child/year</div></div>
    <div class="summary-amount ${r.tfc > 0 ? 'green' : 'red'}">£${Math.round(r.tfc).toLocaleString()}</div>
  </div>
  <div class="summary-row ${r.thirtyHours > 0 ? 'available' : 'locked'}">
    <div><div class="summary-label">30 Hours Free Childcare</div><div class="summary-desc">Government-funded nursery hours for under-5s</div></div>
    <div class="summary-amount ${r.thirtyHours > 0 ? 'green' : 'red'}">£${Math.round(r.thirtyHours).toLocaleString()}</div>
  </div>
  <div class="summary-row available">
    <div><div class="summary-label">Salary Sacrifice / Pension</div><div class="summary-desc">Tax + NI savings on pension contributions</div></div>
    <div class="summary-amount ${r.salary > 0 ? 'green' : 'grey'}">£${Math.round(r.salary).toLocaleString()}</div>
  </div>
  <div class="summary-row ${r.splitting > 0 ? 'available' : 'locked'}">
    <div><div class="summary-label">Income Optimisation</div><div class="summary-desc">Tax band optimisation between partners</div></div>
    <div class="summary-amount ${r.splitting > 0 ? 'green' : 'grey'}">£${Math.round(r.splitting).toLocaleString()}</div>
  </div>
  <div class="total-box">
    <div><div class="total-label">Estimated annual saving</div><div class="total-range">Range: £${Math.round(r.minSaving).toLocaleString()} — £${Math.round(r.maxSaving).toLocaleString()}</div></div>
    <div class="total-amount">£${avg.toLocaleString()}</div>
  </div>

  ${ifsComparison ? `<div class="ifs-callout">
    📊 <strong>IFS Research (2026):</strong> A London parent with two nursery-age children earning £100,001 needs to earn <strong>£149,000</strong> to match the disposable income of someone on £99,999. The combined effect of the 60% tax trap, lost childcare, and lost personal allowance is enormous. This report shows you how to close that gap.
  </div>` : ''}

  <div class="elig-grid" style="margin-top:20px;">
    <div class="elig-item ${!r.over100k ? 'yes' : 'no'}">
      <span style="font-size:18px">${!r.over100k ? '✅' : '❌'}</span>
      <div><div class="elig-text">Tax-Free Childcare</div><div class="elig-sub">${!r.over100k ? 'Eligible — apply now' : 'Blocked — pension can unlock'}</div></div>
    </div>
    <div class="elig-item ${r.has30Hours ? 'yes' : 'no'}">
      <span style="font-size:18px">${r.has30Hours ? '✅' : '❌'}</span>
      <div><div class="elig-text">30 Hours Childcare</div><div class="elig-sub">${r.has30Hours ? 'Eligible — claim your code' : 'Check eligibility rules'}</div></div>
    </div>
    <div class="elig-item ${r.employment !== 'self-employed' ? 'yes' : 'no'}">
      <span style="font-size:18px">${r.employment !== 'self-employed' ? '✅' : '⚠️'}</span>
      <div><div class="elig-text">Salary Sacrifice</div><div class="elig-sub">${r.employment !== 'self-employed' ? 'Available via employer' : 'Not available — self-employed'}</div></div>
    </div>
    <div class="elig-item ${hasPartner ? 'yes' : 'no'}">
      <span style="font-size:18px">${hasPartner ? '✅' : '➖'}</span>
      <div><div class="elig-text">Income Splitting</div><div class="elig-sub">${hasPartner ? 'Dual income — optimise bands' : 'Single income household'}</div></div>
    </div>
  </div>
</div>

<!-- PAGE 3+: STRATEGIES -->
<div class="page">
  <div class="page-header"><div class="page-logo">The 100k Parent</div><div class="page-num">Your Strategies</div></div>
  <h2>Your Personalised Strategies</h2>
  <p class="intro">These strategies are ordered by impact for your specific situation. The numbers are calculated for your income, employment type and family setup.</p>
  ${strategyHTML}
  <div class="disclaimer"><strong>Important:</strong> These figures are estimates based on your inputs and HMRC rules for ${taxYear}. Actual savings depend on your full financial circumstances. Speak to a financial adviser before making changes to pension or remuneration arrangements.</div>
</div>

<!-- NEXT STEPS PAGE -->
<div class="page">
  <div class="page-header"><div class="page-logo">The 100k Parent</div><div class="page-num">Your Action Plan</div></div>
  <h2>Your Action Plan</h2>
  <p class="intro">These are your specific next steps, ordered by urgency and impact. Each one has a clear action you can take today.</p>
  ${nextStepsHTML}
  <div class="disclaimer"><strong>Disclaimer:</strong> This report is for informational purposes only and does not constitute financial, tax or legal advice. The 100k Parent is not FCA regulated. Always consult a qualified financial adviser before making changes to your pension, salary or tax arrangements. Figures are based on ${taxYear} HMRC rules.</div>
</div>

<!-- FOOTER -->
<div class="report-footer">
  <div class="footer-logo">The 100k Parent</div>
  <p>Helping UK families earning over £100k save on childcare costs</p>
  <p style="margin-top:5px;">© 2026 The 100k Parent | the100kparent.com | ${date}</p>
</div>
