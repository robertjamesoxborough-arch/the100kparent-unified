        .card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }

        .card-header { display: flex; align-items: center; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 2px solid #E2E8F0; margin-bottom: 1.5rem; }

        .saving-row:last-of-type { border-bottom: none; }
        .saving-label { font-weight: 600; font-size: 0.9375rem; }
        .saving-desc { font-size: 0.8125rem; color: #A0AEC0; margin-top: 2px; }
        .saving-amount { font-weight: 800; color: #10B981; font-size: 1.25rem; white-space: nowrap; }
        .saving-amount.zero { color: #CBD5E0; }

        .total-box { background: linear-gradient(135deg, #4A90E2, #2E5C8A); border-radius: 16px; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; color: white; }
        .total-label { font-weight: 700; font-size: 1rem; opacity: 0.9; }
        .total-range { font-size: 0.8125rem; opacity: 0.7; margin-top: 4px; }

        .download-btn:hover { background: #059669; transform: translateY(-1px); }
        .download-btn:disabled { background: #A0AEC0; transform: none; cursor: not-allowed; }
        @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(16,185,129,0); } }

        .download-note { text-align: center; font-size: 0.8125rem; color: #A0AEC0; margin-bottom: 1.5rem; }

        .tier-badge { display: inline-block; padding: 0.25rem 0.875rem; border-radius: 20px; font-size: 0.8125rem; font-weight: 700; margin-bottom: 1rem; }
        .tier-badge.essential { background: #E8F4F8; color: #2E5C8A; }
        .tier-badge.complete { background: #4A90E2; color: white; }

        .advisor-box { background: #F0EDFF; border-radius: 14px; padding: 1.5rem; margin-top: 1rem; }
        .advisor-box h3 { color: #7B68EE; margin-bottom: 0.5rem; font-size: 1rem; }
        .advisor-box p { color: #4A5568; font-size: 0.9375rem; line-height: 1.6; }
        .advisor-btn { display: inline-block; background: #7B68EE; color: white; padding: 0.75rem 1.5rem; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 1rem; font-size: 0.9375rem; }

        .no-results { text-align: center; padding: 3rem; }
        .no-results p { color: #718096; margin-bottom: 1.5rem; }
        .no-results a { background: #4A90E2; color: white; padding: 0.875rem 2rem; border-radius: 12px; text-decoration: none; font-weight: 700; }

        @media (max-width: 600px) {
            h1 { font-size: 1.625rem; }
            .total-amount { font-size: 2rem; }
            .container { padding: 2rem 1.25rem; }
        }

        /* Loading state */
        .loading { text-align: center; padding: 4rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid #E2E8F0; border-top-color: #4A90E2; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── PROGRESS BAR ── */
        .pdf-progress-wrap {
            background: #F7FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            padding: 1.5rem;
            margin: 1.5rem 0 0.75rem;
            display: none;
        }
        .pdf-progress-wrap.visible { display: block; }
        .pdf-progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .pdf-progress-text { font-size: 0.9375rem; font-weight: 600; color: #2D3748; }
        .pdf-progress-pct { font-size: 0.875rem; font-weight: 700; color: #4A90E2; }
        .pdf-progress-bar {
            height: 10px;
            background: #E2E8F0;
            border-radius: 99px;
            overflow: hidden;
        }
        .pdf-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4A90E2, #10B981);
            border-radius: 99px;
            width: 0%;
            transition: width 0.4s ease;
        }
        .pdf-progress-step {
            font-size: 0.8125rem;
            color: #718096;
            margin-top: 0.625rem;
            min-height: 1.2em;
        }

        /* ── POPUP WARNING ── */
        .popup-warning {
            background: #FEF3C7;
            border: 2px solid #F59E0B;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: 1rem 0;
            display: none;
        }
        .popup-warning.visible { display: block; }
        .popup-warning-title {
            font-weight: 700;
            font-size: 0.9375rem;
            color: #92400E;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .popup-warning p {
            font-size: 0.875rem;
            color: #78350F;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        .popup-warning p:last-child { margin-bottom: 0; }
        .popup-warning strong { color: #92400E; }

        /* ── BLOCKED FALLBACK ── */
        .blocked-fallback {
            background: #FEE2E2;
            border: 2px solid #EF4444;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: 1rem 0;
            display: none;
        }
        .blocked-fallback.visible { display: block; }
        .blocked-fallback-title {
            font-weight: 700;
            font-size: 0.9375rem;
            color: #991B1B;
            margin-bottom: 0.5rem;
        }
        .blocked-fallback p {
            font-size: 0.875rem;
            color: #7F1D1D;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        .blocked-fallback ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .blocked-fallback li {
            font-size: 0.875rem;
            color: #7F1D1D;
            margin-bottom: 0.375rem;
        }
        .retry-btn {
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #DC2626; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="v2.html" class="nav-logo">The 100k Parent</a>
    <a href="v2.html#calculator" class="nav-back">← Back to Calculator</a>
</nav>

<div class="container" id="mainContent">
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p style="color: #718096;">Preparing your report...</p>
    </div>
</div>

<script>
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    const tier = params.get('tier') || 'essential';
    const tierLabel = tier === 'complete' ? 'Complete Guide' : 'Essential Report';
    const tierPrice = tier === 'complete' ? '£49' : '£19';

    // Read calculator results from localStorage
    const stored = localStorage.getItem('100kp_results');
    const r = stored ? JSON.parse(stored) : null;

    const main = document.getElementById('mainContent');

    if (!r) {
        // No results — send them back to calculator
        main.innerHTML = `
            <div class="no-results">
                <div class="success-icon" style="background: #F59E0B;">⚠️</div>
                <h1>No calculator results found</h1>
                <p>Please complete the savings calculator first so we can personalise your report.</p>
                <a href="v2.html#calculator">Go to Calculator</a>
            </div>`;
    } else {
        const avg = Math.round((r.minSaving + r.maxSaving) / 2);

        main.innerHTML = `
            <div class="success-icon">🎉</div>
            <h1>Your report is ready</h1>
            <p class="subtitle">Your personalised childcare savings report based on your family details</p>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">📄</div>
                    <div>
                        <div class="tier-badge ${tier}">${tierLabel} — ${tierPrice}</div>
                        <div class="card-title">Your Childcare Savings Report</div>
                        <div class="card-sub">The 100k Parent &bull; 2025/26 &bull; Personalised for your family</div>
                    </div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Tax-Free Childcare</div>
                        <div class="saving-desc">20% government top-up on eligible costs</div>
                    </div>
                    <div class="saving-amount ${r.tfc === 0 ? 'zero' : ''}">£${Math.round(r.tfc).toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Salary Sacrifice</div>
                        <div class="saving-desc">Income Tax + National Insurance savings</div>
                    </div>
                    <div class="saving-amount ${r.salary === 0 ? 'zero' : ''}">£${Math.round(r.salary).toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Income Splitting</div>
                        <div class="saving-desc">Optimising income across tax bands</div>
                    </div>
                    <div class="saving-amount ${r.splitting === 0 ? 'zero' : ''}">£${Math.round(r.splitting).toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">30 Hours Free Childcare</div>
                        <div class="saving-desc">Government-funded nursery hours</div>
                    </div>
                    <div class="saving-amount ${r.thirtyHours === 0 ? 'zero' : ''}">£${Math.round(r.thirtyHours).toLocaleString()}</div>
                </div>

                <div class="total-box">
                    <div>
                        <div class="total-label">Your estimated annual saving</div>
                        <div class="total-range">Range: £${Math.round(r.minSaving).toLocaleString()} — £${Math.round(r.maxSaving).toLocaleString()}</div>
                    </div>
                    <div class="total-amount">£${avg.toLocaleString()}</div>
                </div>

                <button class="download-btn" id="downloadBtn" onclick="downloadPDF()">
                    ⬇️ Download Your PDF Report
                </button>

                <!-- Popup warning — shown before PDF opens -->
                <div class="popup-warning" id="popupWarning">
                    <div class="popup-warning-title">⚠️ Allow the pop-up to download your report</div>
                    <p>Your PDF opens in a new tab. Your browser may block it — look for a <strong>pop-up blocked</strong> notification in your address bar and click <strong>Allow</strong>.</p>
                    <p>On mobile, tap <strong>Allow</strong> if prompted, or use the button below if nothing opens.</p>
                </div>

                <!-- Progress bar -->
                <div class="pdf-progress-wrap" id="progressWrap">
                    <div class="pdf-progress-label">
                        <span class="pdf-progress-text" id="progressText">Preparing your report...</span>
                        <span class="pdf-progress-pct" id="progressPct">0%</span>
                    </div>
                    <div class="pdf-progress-bar">
                        <div class="pdf-progress-fill" id="progressFill"></div>
                    </div>
                    <div class="pdf-progress-step" id="progressStep">Loading your data...</div>
                </div>

                <!-- Blocked fallback -->
                <div class="blocked-fallback" id="blockedFallback">
                    <div class="blocked-fallback-title">🚫 Pop-up blocked — here's how to fix it</div>
                    <p>Your browser blocked the PDF from opening. To allow it:</p>
                    <ol>
                        <li>Look at the top of your browser for a <strong>pop-up blocked</strong> icon</li>
                        <li>Click it and select <strong>Always allow pop-ups from this site</strong></li>
                        <li>Then click the button below to try again</li>
                    </ol>
                    <p>Or on iPhone/Safari: Settings → Safari → Block Pop-ups → turn off</p>
                    <button class="retry-btn" onclick="retryPDF()">Try Again</button>
                </div>

                ${tier === 'complete' ? `
                <div class="advisor-box">
                    <h3>📞 Your 30-Minute Advisor Call</h3>
                    <p>As a Complete Guide customer, you have a free call with our childcare savings advisor included. They will review your situation and help you implement the strategies.</p>
                    <a href="https://calendly.com/the100kparent" target="_blank" class="advisor-btn">Book Your Call</a>
                </div>` : ''}
            </div>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="v2.html#calculator" style="color: #4A90E2; font-size: 0.875rem; text-decoration: none; font-weight: 600;">← Recalculate with different figures</a>
            </div>`;

        // Auto-trigger PDF download after short delay
        // Auto-trigger handled by startPDFGeneration above
    }

    function downloadPDF() {
        const stored = localStorage.getItem('100kp_results');
        if (!stored) return;

        // window.open MUST be called synchronously from user click — not inside setTimeout
        // Open the window immediately, then write content to it
        const win = window.open('', '_blank');

        if (!win || win.closed || typeof win.closed === 'undefined') {
            document.getElementById('blockedFallback').classList.add('visible');
            document.getElementById('popupWarning').classList.remove('visible');
            return;
        }

        // Now animate the progress bar while we build the HTML
        const r = JSON.parse(stored);
        showProgressBar();

        // Build HTML and write it after progress completes
        setTimeout(() => setProgress(20, 'Building your family profile...'), 100);
        setTimeout(() => setProgress(40, 'Calculating your savings...'), 300);
        setTimeout(() => setProgress(60, 'Writing your action plan...'), 600);
        setTimeout(() => setProgress(80, 'Applying formatting...'), 900);
        setTimeout(() => {
            setProgress(100, 'Done! Opening your report...');
            const html = generatePDFHTML(r, tier);
            win.document.write(html);
            win.document.close();
            win.focus();
            setTimeout(() => {
                win.print();
                document.getElementById('downloadBtn').textContent = '⬇️ Download Again';
                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('popupWarning').classList.remove('visible');
            }, 600);
        }, 1200);
    }

    function retryPDF() {
        document.getElementById('blockedFallback').classList.remove('visible');
        downloadPDF();
    }

    function showProgressBar() {
        const btn = document.getElementById('downloadBtn');
        btn.disabled = true;
        btn.textContent = 'Preparing PDF...';
        document.getElementById('popupWarning').classList.add('visible');
        document.getElementById('progressWrap').classList.add('visible');
        setProgress(0, 'Loading your data...');
    }

    function setProgress(pct, step) {
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct + '%';
        document.getElementById('progressStep').textContent = step;
    }

    // Auto-trigger on page load — must still be user-initiated for popup to work
    // So instead we show a prominent download button and prompt rather than auto-opening
    setTimeout(() => {
        const btn = document.getElementById('downloadBtn');
        if (btn) {
            btn.style.animation = 'pulse 1.5s ease-in-out 2';
        }
    }, 800);

    function generatePDFHTML(r, tier) {
        const avg = Math.round((r.minSaving + r.maxSaving) / 2);
        const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        const tierLabel = tier === 'complete' ? 'Complete Guide' : 'Essential Report';

        const html = `<!DOCTYPE html>

  .cover-logo { font-size: 22px; font-weight: 800; color: #2E5C8A; }
  .cover-badge { display: inline-block; background: #4A90E2; color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 24px; }

<body>

  <div class="calc-box"><h3>Tax-Free Childcare (TFC)</h3><p>The government adds 20p for every 80p you pay into a Tax-Free Childcare account, up to £2,000 per child per year. Both partners must earn at least £2,379/year and neither can earn over £100,000. We calculate: annual childcare spend × 20% = TFC saving, capped at £2,000 per child.</p></div>
  <div class="calc-box"><h3>Salary Sacrifice</h3><p>By paying into your pension via salary sacrifice, you reduce your gross salary, saving Income Tax and National Insurance. For higher-rate taxpayers (income over £50,270), the combined saving is approximately 42p per £1 sacrificed. We apply a conservative sacrifice amount of 30% of annual childcare costs, capped at £5,000 per year.</p></div>
  <div class="calc-box"><h3>Income Splitting</h3><p>Where one partner earns above the higher-rate threshold (£50,270) and the other earns below it, there may be opportunities to redistribute income to reduce the overall household tax bill. We apply a conservative estimate of £3,000 per year where this applies.</p></div>
  <div class="calc-box"><h3>30 Hours Free Childcare</h3><p>Eligible working parents of children aged 9 months to 4 years can claim up to 30 hours of free childcare per week for 38 weeks per year. We calculate the value at the average UK nursery rate of £15/hour × 1,140 hours per eligible child per year.</p></div>
