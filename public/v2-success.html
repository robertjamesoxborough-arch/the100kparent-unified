<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Report is Ready | The 100k Parent</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F7FAFC; color: #2D3748; min-height: 100vh; }

        .nav { background: white; border-bottom: 1px solid #E2E8F0; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-size: 1.25rem; font-weight: 800; color: #062A4E; text-decoration: none; }
        .nav-back { font-size: 0.875rem; color: #093F72; text-decoration: none; font-weight: 600; }

        .container { max-width: 700px; margin: 0 auto; padding: 3rem 1.5rem; }

        .report-ready-mark { width: 80px; height: 80px; background: white; border: 2px solid #E2E8F0; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 4px 16px rgba(9,63,114,0.10); }

        h1 { text-align: center; font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #718096; font-size: 1.0625rem; margin-bottom: 2.5rem; }
        /* Deliberately body-text size and full contrast. This has to be read
           before the action steps, not discovered underneath them. */
        /* The funded-hours figure is a national average, so the caveat travels
           with the number everywhere it is shown. */
        .funded-hours-note {
            font-size: 0.8125rem;
            line-height: 1.55;
            color: #475569;
            margin-top: 6px;
            max-width: 34rem;
        }

        .key-disclaimer {
            background: #FFFBEB;
            border: 1px solid #FDE68A;
            border-left: 4px solid #F59E0B;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin: 0 auto 2rem;
            max-width: 46rem;
            font-size: 0.9375rem;
            line-height: 1.65;
            color: #1E293B;
        }

        .card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }

        .card-header { display: flex; align-items: center; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 2px solid #E2E8F0; margin-bottom: 1.5rem; }
        .card-icon { width: 50px; height: 50px; background: #093F72; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .card-title { font-weight: 800; font-size: 1.125rem; }
        .card-sub { color: #718096; font-size: 0.875rem; margin-top: 2px; }

        .saving-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #F7FAFC; }
        .saving-row:last-of-type { border-bottom: none; }
        .saving-label { font-weight: 600; font-size: 0.9375rem; }
        .saving-desc { font-size: 0.8125rem; color: #A0AEC0; margin-top: 2px; }
        .saving-amount { font-weight: 800; color: #15803D; font-size: 1.25rem; white-space: nowrap; }
        .saving-amount.zero { color: #CBD5E0; }

        .total-box { background: linear-gradient(135deg, #093F72, #062A4E); border-radius: 16px; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; color: white; }
        .total-label { font-weight: 700; font-size: 1rem; opacity: 0.9; }
        .total-range { font-size: 0.8125rem; opacity: 0.7; margin-top: 4px; }
        .total-amount { font-size: 2.5rem; font-weight: 800; }

        .download-btn { display: block; width: 100%; background: #15803D; color: white; border: none; border-radius: 14px; padding: 1.125rem; font-size: 1.125rem; font-weight: 700; cursor: pointer; text-align: center; margin: 1.5rem 0 0.75rem; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .download-btn:hover { background: #14532D; transform: translateY(-1px); }
        .download-btn:disabled { background: #A0AEC0; transform: none; cursor: not-allowed; }
        @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(21,128,61,0.4); } 50% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(21,128,61,0); } }

        .download-note { text-align: center; font-size: 0.8125rem; color: #A0AEC0; margin-bottom: 1.5rem; }

        .tier-badge { display: inline-block; padding: 0.25rem 0.875rem; border-radius: 20px; font-size: 0.8125rem; font-weight: 700; margin-bottom: 1rem; }
        .tier-badge.essential { background: #E1EFFC; color: #062A4E; }
        .tier-badge.complete { background: #093F72; color: white; }

        .advisor-box { background: #F0EDFF; border-radius: 14px; padding: 1.5rem; margin-top: 1rem; }
        .advisor-introducer { font-size: 0.875rem; line-height: 1.6; color: #3730A3; background: rgba(255,255,255,0.6); border-radius: 8px; padding: 0.75rem 1rem; margin-top: 0.75rem; }
        .advisor-box h3 { color: #7B68EE; margin-bottom: 0.5rem; font-size: 1rem; }
        .advisor-box p { color: #4A5568; font-size: 0.9375rem; line-height: 1.6; }
        .advisor-btn { display: inline-block; background: #7B68EE; color: white; padding: 0.75rem 1.5rem; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 1rem; font-size: 0.9375rem; }

        .no-results { text-align: center; padding: 3rem; }
        .no-results p { color: #718096; margin-bottom: 1.5rem; }
        .no-results a { background: #093F72; color: white; padding: 0.875rem 2rem; border-radius: 12px; text-decoration: none; font-weight: 700; }

        @media (max-width: 600px) {
            h1 { font-size: 1.625rem; }
            .total-amount { font-size: 2rem; }
            .container { padding: 2rem 1.25rem; }
        }

        /* Loading state */
        .loading { text-align: center; padding: 4rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid #E2E8F0; border-top-color: #093F72; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── PROGRESS BAR ── */
        .pdf-progress-wrap {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 1.75rem;
            margin: 1.5rem 0 0.75rem;
            display: none;
            box-shadow: 0 4px 20px rgba(74,144,226,0.1);
        }
        .pdf-progress-wrap.visible { display: block; }
        .pdf-progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .pdf-progress-text {
            font-size: 1rem;
            font-weight: 700;
            color: #2D3748;
        }
        .pdf-progress-pct {
            font-size: 1.25rem;
            font-weight: 800;
            color: #4A90E2;
            min-width: 3rem;
            text-align: right;
        }
        .pdf-progress-bar {
            height: 12px;
            background: #EDF2F7;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 0.875rem;
        }
        .pdf-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4A90E2, #7B68EE);
            border-radius: 99px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pdf-progress-step {
            font-size: 0.875rem;
            color: #718096;
            min-height: 1.4em;
            transition: opacity 0.3s;
        }
        .pdf-progress-steps-row {
            display: flex;
            justify-content: space-between;
            margin-top: 0.875rem;
            gap: 0.25rem;
        }
        .pdf-step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E2E8F0;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .pdf-step-dot.done { background: #4A90E2; }

        /* ── POPUP WARNING ── */
        .popup-warning {
            background: #FEF3C7;
            border: 2px solid #F59E0B;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: 1rem 0;
            display: none;
        }
        .popup-warning.visible { display: block; }
        .popup-warning-title {
            font-weight: 700;
            font-size: 0.9375rem;
            color: #92400E;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .popup-warning p {
            font-size: 0.875rem;
            color: #78350F;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        .popup-warning p:last-child { margin-bottom: 0; }
        .popup-warning strong { color: #92400E; }

        /* ── BLOCKED FALLBACK ── */
        .blocked-fallback {
            background: #FEE2E2;
            border: 2px solid #EF4444;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: 1rem 0;
            display: none;
        }
        .blocked-fallback.visible { display: block; }
        .blocked-fallback-title {
            font-weight: 700;
            font-size: 0.9375rem;
            color: #991B1B;
            margin-bottom: 0.5rem;
        }
        .blocked-fallback p {
            font-size: 0.875rem;
            color: #7F1D1D;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        .blocked-fallback ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .blocked-fallback li {
            font-size: 0.875rem;
            color: #7F1D1D;
            margin-bottom: 0.375rem;
        }
        .retry-btn {
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #DC2626; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="v2.html" class="nav-logo">The 100k Parent</a>
    <a href="v2.html#calculator" class="nav-back">← Back to Calculator</a>
</nav>

<div class="container" id="mainContent">
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p style="color: #718096;">Preparing your report...</p>
    </div>
</div>

<script>
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    const tier = params.get('tier') || 'complete';
    // Only the Complete Guide is live. The Essential tier is unreachable, so
    // the page must not advertise its price back to the buyer.
    const tierLabel = 'Complete Guide';
    const tierPrice = '£49';

    // The shape the calculator writes. A blob from an older version is refused
    // rather than part-read: the previous fallbacks silently rendered figures
    // from a superseded formula, which is how a stale result could show a
    // number 2.75x higher than the current calculator would produce.
    const RESULTS_SCHEMA_VERSION = 3;

    // Every figure the report renders must be a real number. Guarding at the
    // point of read means a missing or malformed field can never reach the page
    // as "£NaN".
    function isFiniteNumber(v) {
        return typeof v === 'number' && Number.isFinite(v);
    }

    function readResults() {
        const stored = localStorage.getItem('100kp_results');
        if (!stored) return { status: 'empty' };

        let parsed;
        try {
            parsed = JSON.parse(stored);
        } catch (err) {
            return { status: 'corrupt' };
        }

        if (!parsed || typeof parsed !== 'object') return { status: 'corrupt' };
        if (parsed.schemaVersion !== RESULTS_SCHEMA_VERSION) return { status: 'stale' };

        const required = ['displayTfc', 'displaySalary', 'displayThirtyHours', 'displayTotal',
                          'income1', 'monthlyChildcare', 'numChildren'];
        if (required.some(k => !isFiniteNumber(parsed[k]))) return { status: 'corrupt' };
        if (!Array.isArray(parsed.ages)) return { status: 'corrupt' };

        return { status: 'ok', data: parsed };
    }

    const loaded = readResults();
    const r = loaded.status === 'ok' ? loaded.data : null;

    const main = document.getElementById('mainContent');

    if (!r) {
        const message = loaded.status === 'empty'
            ? 'Please complete the savings calculator first so we can personalise your report.'
            : 'We could not read your saved results, so we have not shown you a report rather than risk showing you the wrong numbers. Please run the calculator again and your report will rebuild.';
        const heading = loaded.status === 'empty'
            ? 'No calculator results found'
            : 'Something went wrong reading your results';
        main.innerHTML = `
            <div class="no-results">
                <div class="success-icon" style="background: #F59E0B;">⚠️</div>
                <h1>${heading}</h1>
                <p>${message}</p>
                <a href="v2.html#calculator">Go to Calculator</a>
            </div>`;
    } else {
        const potentialTfc = r.displayTfc;
        const potentialThirtyHours = r.displayThirtyHours;
        const potentialSalary = r.displaySalary;
        // Comes from the calculator so the rate quoted here can never drift from
        // the rate the figure was actually calculated with.
        const fundedHoursNote = r.fundedHoursNote || '';
        // Fully self-employed households can't salary sacrifice — the figure comes from
        // personal pension contributions instead, so the line is labelled accordingly.
        const summaryBothSelfEmployed = r.employment === 'self-employed'
            && (r.employment2 === 'self-employed' || !(r.income2 > 0));
        const salaryLabel = summaryBothSelfEmployed ? 'Pension contributions' : 'Salary Sacrifice';
        const salaryDesc = summaryBothSelfEmployed
            ? 'Income Tax relief + personal-allowance restoration'
            : 'Income Tax + National Insurance savings';
        const avg = r.displayTotal;
        const rangeMin = Math.min(potentialTfc, potentialThirtyHours, potentialSalary);
        const rangeMax = avg;

        main.innerHTML = `
            <div class="report-ready-mark">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#093F72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="#EBF4FF"/>
                    <polyline points="14 2 14 8 20 8" stroke="#093F72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="9 15 11 17 15 13" stroke="#15803D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Your report is ready</h1>
            <p class="subtitle">Your personalised childcare savings report based on your family details</p>

            <div class="key-disclaimer">
                <strong>Important:</strong> this report contains general information and estimates only. It is not financial, tax or legal advice, and not a personal recommendation. Figures are based on UK rules as at 6 April 2026 and the information you provided. Rules change and your circumstances may differ. Verify anything you intend to act on with a qualified adviser and gov.uk. We accept no liability for decisions made on the basis of this report, save where liability cannot lawfully be excluded.
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">📄</div>
                    <div>
                        <div class="tier-badge ${tier}">${tierLabel} — ${tierPrice}</div>
                        <div class="card-title">Your Childcare Savings Report</div>
                        <div class="card-sub">The 100k Parent &bull; ${r.taxYear || '2026/27'} &bull; Personalised for your family</div>
                    </div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">Tax-Free Childcare</div>
                        <div class="saving-desc">20% government top-up on eligible costs</div>
                    </div>
                    <div class="saving-amount">£${potentialTfc.toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">${salaryLabel}</div>
                        <div class="saving-desc">${salaryDesc}</div>
                    </div>
                    <div class="saving-amount ${potentialSalary === 0 ? 'zero' : ''}">£${potentialSalary.toLocaleString()}</div>
                </div>

                <div class="saving-row">
                    <div>
                        <div class="saving-label">${r.fundedHoursPerWeek || 30} Hours Free Childcare</div>
                        <div class="saving-desc">${r.over100k && potentialThirtyHours > 0 ? 'Universal entitlement — no income test, claim this whatever you earn' : 'Government-funded nursery hours'}</div>
                        ${potentialThirtyHours > 0 ? `<div class="funded-hours-note">${fundedHoursNote}</div>` : ''}
                    </div>
                    <div class="saving-amount">£${potentialThirtyHours.toLocaleString()}</div>
                </div>

                <div class="total-box">
                    <div>
                        <div class="total-label">Your possible annual saving</div>
                        <div class="total-range">Range: £${rangeMin.toLocaleString()} — £${rangeMax.toLocaleString()}</div>
                    </div>
                    <div class="total-amount">£${avg.toLocaleString()}</div>
                </div>

                ${r.over100k ? `<p style="margin-top:12px;font-size:13px;color:#92400E;background:#FFF7ED;border-left:3px solid #F59E0B;padding:10px 12px;border-radius:0 8px 8px 0;line-height:1.55;">ℹ️ Because your income is over £100,000, the Tax-Free Childcare and 30-hours figures above become claimable once you bring your adjusted net income under £100,000 — usually via a pension contribution, whose own tax relief is also part of this total. Your report shows exactly how.</p>` : ''}

                <button class="download-btn" id="downloadBtn" onclick="downloadPDF()">
                    ⬇️ Download your full PDF Report
                </button>

                <!-- Popup warning — shown before PDF opens -->
                <div class="popup-warning" id="popupWarning">
                    <div class="popup-warning-title">⚠️ Allow the pop-up to download your report</div>
                    <p>Your PDF opens in a new tab. Your browser may block it — look for a <strong>pop-up blocked</strong> notification in your address bar and click <strong>Allow</strong>.</p>
                    <p>On mobile, tap <strong>Allow</strong> if prompted, or use the button below if nothing opens.</p>
                </div>

                <!-- Progress bar -->
                <div class="pdf-progress-wrap" id="progressWrap">
                    <div class="pdf-progress-label">
                        <span class="pdf-progress-text" id="progressText">Preparing your report</span>
                        <span class="pdf-progress-pct" id="progressPct">0%</span>
                    </div>
                    <div class="pdf-progress-bar">
                        <div class="pdf-progress-fill" id="progressFill"></div>
                    </div>
                    <div class="pdf-progress-step" id="progressStep">Starting...</div>
                    <div class="pdf-progress-steps-row">
                        <div class="pdf-step-dot" id="dot0"></div>
                        <div class="pdf-step-dot" id="dot1"></div>
                        <div class="pdf-step-dot" id="dot2"></div>
                        <div class="pdf-step-dot" id="dot3"></div>
                        <div class="pdf-step-dot" id="dot4"></div>
                        <div class="pdf-step-dot" id="dot5"></div>
                    </div>
                </div>

                <!-- Blocked fallback -->
                <div class="blocked-fallback" id="blockedFallback">
                    <div class="blocked-fallback-title">🚫 Pop-up blocked — here's how to fix it</div>
                    <p>Your browser blocked the PDF from opening. To allow it:</p>
                    <ol>
                        <li>Look at the top of your browser for a <strong>pop-up blocked</strong> icon</li>
                        <li>Click it and select <strong>Always allow pop-ups from this site</strong></li>
                        <li>Then click the button below to try again</li>
                    </ol>
                    <p>Or on iPhone/Safari: Settings → Safari → Block Pop-ups → turn off</p>
                    <button class="retry-btn" onclick="retryPDF()">Try Again</button>
                </div>

                ${tier === 'complete' ? `
                <div class="advisor-box">
                    <h3>📞 30-Minute Consultation with a Qualified Financial Adviser</h3>
                    <p>Your Complete Guide includes a private 30-minute meeting with an FCA-regulated financial adviser. They will review your personal tax position, confirm your eligibility for each saving strategy, and provide tailored recommendations you can act on immediately. This is a professional advisory session, not a sales call.</p>
                    <p class="advisor-introducer">The 100k Parent connects you with an FCA-regulated financial adviser for your call. Any regulated financial advice given during that call is provided by the adviser under their own FCA authorisation and terms of business, not by The 100k Parent. We are an introducer only and do not provide regulated advice ourselves.</p>
                    <!-- TODO: Calendly re-signup pending. This URL currently returns 404.
                         Swap for the real booking link once the account is live. See GO-LIVE-CHECKLIST.md -->
                    <a href="https://calendly.com/the100kparent" target="_blank" class="advisor-btn">Schedule Your Consultation</a>
                </div>` : ''}
            </div>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="v2.html#calculator" style="color: #093F72; font-size: 0.875rem; text-decoration: none; font-weight: 600;">← Recalculate with different figures</a>
            </div>`;

        // Auto-trigger PDF download after short delay
        // Auto-trigger handled by startPDFGeneration above
    }

    function downloadPDF() {
        const stored = localStorage.getItem('100kp_results');
        if (!stored) {
            alert('Please fill in the calculator first, then come back here.');
            return;
        }

        const r = JSON.parse(stored);

        // Show progress bar IMMEDIATELY so screen doesn't freeze
        showProgressBar();
        setProgress(10, 'Loading your data...');

        // Use requestAnimationFrame to let the browser paint the progress bar
        // before we do the heavy work
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setProgress(25, 'Building your profile...');

                setTimeout(() => {
                    setProgress(50, 'Calculating your strategies...');

                    setTimeout(() => {
                        setProgress(75, 'Writing your action plan...');

                        setTimeout(() => {
                            setProgress(90, 'Opening your report...');

                            // NOW build the HTML — after UI has painted
                            const html = generatePDFHTML(r, tier);

                            // Open new window
                            const win = window.open('', '_blank');

                            if (!win || win.closed || typeof win.closed === 'undefined') {
                                document.getElementById('blockedFallback').classList.add('visible');
                                document.getElementById('popupWarning').classList.remove('visible');
                                document.getElementById('progressWrap').classList.remove('visible');
                                document.getElementById('downloadBtn').disabled = false;
                                document.getElementById('downloadBtn').textContent = '⬇️ Try Again';
                                return;
                            }

                            // Write HTML to new tab
                            win.document.write(html);
                            win.document.close();

                            // Open report without triggering print
                            setTimeout(() => {
                                try { win.focus(); } catch(e) {}
                                setProgress(100, '✅ Your report is open in a new tab.');
                                document.getElementById('downloadBtn').textContent = '⬇️ Download Again';
                                document.getElementById('downloadBtn').disabled = false;
                                document.getElementById('popupWarning').classList.remove('visible');
                            }, 1500);

                        }, 400);
                    }, 400);
                }, 400);
            });
        });
    }

    function retryPDF() {
        document.getElementById('blockedFallback').classList.remove('visible');
        downloadPDF();
    }

    function showProgressBar() {
        const btn = document.getElementById('downloadBtn');
        btn.disabled = true;
        btn.textContent = 'Preparing...';
        document.getElementById('popupWarning').classList.add('visible');
        document.getElementById('progressWrap').classList.add('visible');
        setProgress(0, 'Starting...');
    }

    function setProgress(pct, step) {
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct + '%';
        document.getElementById('progressStep').textContent = step;
        for (let i = 0; i < 6; i++) {
            const dot = document.getElementById('dot' + i);
            if (dot) dot.classList.toggle('done', pct >= (i + 1) * 17);
        }
        if (pct === 100) {
            document.getElementById('progressText').textContent = 'Report ready!';
            document.getElementById('progressFill').style.background = 'linear-gradient(90deg, #15803D, #14532D)';
            for (let i = 0; i < 6; i++) {
                const dot = document.getElementById('dot' + i);
                if (dot) { dot.classList.add('done'); dot.style.background = '#15803D'; }
            }
        }
    }

    // Pulse button on load
    setTimeout(() => {

.ct-note { font-size:11.5px; line-height:1.55; color:#475569; padding:8px 10px 2px; }
.disclaimer { background:#F8FAFC; border-left:3px solid #CBD5E0; padding:12px 16px; border-radius:0 8px 8px 0; margin-top:22px; font-size:11px; color:#94A3B8; line-height:1.65; }
.rfooter { text-align:center; padding:22px 50px; background:#0F2D52; }
.rfooter-logo { font-size:15px; font-weight:800; color:#fff; margin-bottom:5px; }
.rfooter p { font-size:10.5px; color:rgba(255,255,255,0.4); }

@media print {
    body { -webkit-print-color-adjust:exact; print-color-adjust:exact; background:white; padding:0; }
    .report { max-width:100%; box-shadow:none; margin:0; }
    .s-card, .step-row { page-break-inside:avoid; }
    .cover { page-break-after:always; }
    .page { page-break-after:always; }
    .page:last-child { page-break-after:avoid; }
}
</style>
</head>
<body>
<div class="report">

<!-- PAGE 1: FAMILY DASHBOARD -->
<div class="page">
    <div class="cover-topbar" style="margin:-38px -50px 0;">
        <span class="cover-logo">The 100k Parent</span>
        <span class="cover-tier">${tierLabel} &bull; Tax Year ${taxYear}</span>
    </div>
    <div class="cover-hero" style="margin:0 -50px 28px;">
        <div class="cover-eyebrow">Personalised Childcare Savings Report</div>
        <h1 class="cover-title">Your family could save £${avg.toLocaleString()} this year.</h1>
        <div class="cover-rule"></div>
    </div>
    <div class="section-heading"><div class="section-heading-bar"></div><h2>Your Family Dashboard</h2></div>
    <p class="intro">This report is built on the figures below. Recalculate at any time at the100kparent.com/v2 if your situation changes.</p>
    <div class="pgrid">
        <!-- Row 1: Incomes | Children info -->
        <div class="pitem"><div class="plabel">Your Income</div><div class="pval">£${income1.toLocaleString()}</div></div>
        <div class="pitem"><div class="plabel">Partner's Income</div><div class="pval">${hasPartner ? '£' + income2.toLocaleString() : 'Not applicable'}</div></div>
        <div class="pitem"><div class="plabel">Number of Children</div><div class="pval">${numChildren}</div></div>
        <div class="pitem"><div class="plabel">Monthly Childcare</div><div class="pval">£${monthlyChildcare.toLocaleString()}/mo (£${annualChildcare.toLocaleString()}/yr)</div></div>
        <!-- Row 2: Pensions under incomes | Ages & Employment -->
        <div class="pitem"><div class="plabel">Your Monthly Pension</div><div class="pval">${r.pension1 ? '£' + r.pension1.toLocaleString() : 'Not provided'}</div></div>
        <div class="pitem"><div class="plabel">Partner's Monthly Pension</div><div class="pval">${hasPartner ? (r.pension2 ? '£' + r.pension2.toLocaleString() : 'Not provided') : 'Not applicable'}</div></div>
        <div class="pitem"><div class="plabel">Children's Ages</div><div class="pval">${ages.map(a => a < 0 ? 'Under 9 mths' : a === 0 ? '9-11 mths' : a + ' yrs').join(', ')}</div></div>
        <div class="pitem"><div class="plabel">Employment</div><div class="pval" style="text-transform:capitalize">${employment.replace('-',' ')}${hasPartner ? ' / ' + employment2.replace('-',' ') : ''}</div></div>
    </div>
    ${over100k ? `
    <div style="margin-top:16px;">
        <div style="font-size:10.5px;font-weight:700;color:#1E40AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #BFDBFE;">You could be eligible for:</div>
        <div class="elig-grid">
            <div class="elig" style="background:#EFF6FF;border:1px solid #BFDBFE;"><div><div class="elig-text">Tax-Free Childcare</div><div class="elig-sub">Pension contribution can unlock this</div></div></div>
            <div class="elig" style="background:#EFF6FF;border:1px solid #BFDBFE;"><div><div class="elig-text">${fundedHoursPerWeek} Hours Free Childcare</div><div class="elig-sub">${keepsUniversalOnly ? `You already have the universal ${r.fundedUniversalHours || 15} — a pension contribution unlocks the rest` : 'Pension contribution can unlock this'}</div></div></div>
        </div>
    </div>` : ''}
</div>

<!-- COVER -->
<div class="cover">
    <div class="cover-body">
        <p class="cover-sub">Built around your exact income, family setup and childcare costs — with HMRC-accurate numbers and step-by-step action plans for every strategy.</p>
        <div class="cover-persona">
            <p>${personaDesc}</p>
        </div>
    </div>
    <div class="cover-bottombar">
        <span class="cover-meta">Prepared ${date} &bull; the100kparent.com</span>
        <span class="cover-meta">For personal use only</span>
    </div>
</div>

<!-- PAGE 2: ESTIMATED SAVINGS -->
<div class="page">
    <div class="ph"><div class="ph-left"><div class="ph-mark"></div><div class="ph-logo">The 100k Parent</div></div><div class="ph-page">Your Savings Summary &bull; ${taxYear}</div></div>
    <div class="section-heading"><div class="section-heading-bar"></div><h2>Estimated Annual Savings</h2></div>
    <div class="sum-row ok"><div><div class="sum-label">Tax-Free Childcare</div><div class="sum-desc">20% govt top-up, max £${(2000*numChildren).toLocaleString()}/yr (${numChildren} child${numChildren>1?'ren':''})</div></div><div class="sum-amt green">£${pdfTfc.toLocaleString()}</div></div>
    <div class="sum-row ok"><div><div class="sum-label">${fundedHoursLabel}</div><div class="sum-desc">${keepsUniversalOnly ? 'Universal entitlement — no income test' : 'Govt-funded nursery hours'}</div></div><div class="sum-amt green">£${pdfThirtyHours.toLocaleString()}</div></div>
    <div class="sum-row ok"><div><div class="sum-label">${bothSelfEmployed ? 'Pension Contributions' : 'Salary Sacrifice / Pension'}</div><div class="sum-desc">${bothSelfEmployed ? `Income Tax relief + personal-allowance restoration` : `Tax + NI savings at ${Math.round(sacrificeTaxRate*100)}% effective rate`}</div></div><div class="sum-amt ${salaryPensionSaving > 0 ? 'green' : 'grey'}">£${salaryPensionSaving.toLocaleString()}</div></div>
    <div class="tot-box"><div><div class="tot-label">Estimated Savings</div></div><div class="tot-amount">£${avg.toLocaleString()}</div></div>

    ${over100k ? `
    <div class="alert amber" style="margin-top:14px;">
        <strong>How these become claimable:</strong> ${keepsUniversalOnly
            ? `The <strong>£${pdfThirtyHours.toLocaleString()}</strong> of funded hours above is yours <em>now</em> — every 3- and 4-year-old gets the universal ${r.fundedUniversalHours || 15} hours and there is no income test on it, so claim it whatever you earn. Tax-Free Childcare and the top-up to ${fundedHoursPerWeek} hours are the parts you don't qualify for <em>yet</em>: those need a pension contribution to bring your adjusted net income under £100,000 — see the Priority Action that follows.`
            : `With income over £100,000 you don't qualify for Tax-Free Childcare or the funded hours <em>yet</em>. The figures above are what you unlock once a pension contribution brings your adjusted net income under £100,000 — see the Priority Action that follows.`} The relief on that contribution is the third line above.
    </div>
    ` : `
    <div class="elig-grid">
        <div class="elig yes"><span style="font-size:16px">✅</span><div><div class="elig-text">Tax-Free Childcare</div><div class="elig-sub">Eligible — apply now</div></div></div>
        <div class="elig ${r.has30Hours ? 'yes' : currentFundedHours > 0 ? 'maybe' : 'no'}"><span style="font-size:16px">${r.has30Hours ? '✅' : currentFundedHours > 0 ? '⚠️' : '❌'}</span><div><div class="elig-text">${currentFundedHours || fundedHoursPerWeek} Hours Childcare</div><div class="elig-sub">${r.has30Hours ? 'Eligible — claim code now' : currentFundedHours > 0 ? `Universal ${currentFundedHours} hours only — claim code now` : 'Check eligibility'}</div></div></div>
        <div class="elig ${!bothSelfEmployed ? 'yes' : 'maybe'}"><span style="font-size:16px">${!bothSelfEmployed ? '✅' : '⚠️'}</span><div><div class="elig-text">Salary Sacrifice</div><div class="elig-sub">${!bothSelfEmployed ? 'Available — ask HR' : 'Not available — self-employed'}</div></div></div>
        <div class="elig ${hasPartner ? 'yes' : 'no'}"><span style="font-size:16px">${hasPartner ? '✅' : '➖'}</span><div><div class="elig-text">Income Splitting</div><div class="elig-sub">${hasPartner ? 'Dual income — opportunities exist' : 'Single income household'}</div></div></div>
        <div class="elig ${!hicbcApplies ? 'yes' : cbNetBenefit > 0 ? 'maybe' : 'no'}"><span style="font-size:16px">${!hicbcApplies ? '✅' : '⚠️'}</span><div><div class="elig-text">Child Benefit</div><div class="elig-sub">${!hicbcApplies ? 'Full £' + totalCB.toLocaleString() + '/yr' : 'Net £' + Math.max(0,cbNetBenefit).toLocaleString() + '/yr — still register'}</div></div></div>
        <div class="elig ${workplaceNurseryEligible ? 'yes' : 'no'}"><span style="font-size:16px">${workplaceNurseryEligible ? '✅' : '❌'}</span><div><div class="elig-text">Workplace Nursery Benefit</div><div class="elig-sub">${workplaceNurseryEligible ? 'Check with HR — avg £6,500/yr' : 'Not available self-employed'}</div></div></div>
    </div>
    `}
</div>

<!-- PAGE 3+: STRATEGIES -->
<div class="page">
    <div class="ph"><div class="ph-left"><div class="ph-mark"></div><div class="ph-logo">The 100k Parent</div></div><div class="ph-page">Your Strategies &bull; ${taxYear}</div></div>
    <h2>Your Personalised Strategies</h2>
    <p class="intro">Ordered by impact for your specific situation. Each strategy includes your exact numbers, a clear explanation of how it works, and specific action steps.</p>
    ${strategies}
    <div class="disclaimer"><strong>Important — Guidance Only:</strong> The figures in this report are estimates calculated from the inputs you provided and are intended for illustrative purposes only. They cannot be relied upon to determine eligibility for, or the value of, any government benefit or scheme including Tax-Free Childcare and government-funded childcare hours. Actual savings and entitlements depend on your full financial circumstances, employer arrangements, HMRC rules and the timing of any contributions or applications. You or your accountant are responsible for verifying all calculations and for any applications submitted to HMRC or any government scheme. Always confirm your adjusted net income with a qualified accountant or financial adviser before making any changes.</div>
</div>

<!-- NEXT STEPS -->
<div class="page">
    <div class="ph"><div class="ph-left"><div class="ph-mark"></div><div class="ph-logo">The 100k Parent</div></div><div class="ph-page">Your Action Plan &bull; ${taxYear}</div></div>
    <h2>Your Action Plan</h2>
    <p class="intro">These are your specific next steps, ordered by urgency and financial impact. Each one has a direct action you can take today.</p>
    ${steps}
    <div class="disclaimer"><strong>Disclaimer:</strong> This report is for informational purposes only and does not constitute financial, tax or legal advice. All figures are estimates for guidance only and cannot be relied upon to qualify for any government scheme or benefit. You or your accountant are responsible for verifying all calculations and for any applications made to HMRC or any government scheme. The 100k Parent is not FCA regulated. Always consult a qualified financial adviser or accountant before making changes to your pension, salary structure or tax arrangements. HMRC rules and rates quoted are for the ${taxYear} tax year and may change.</div>
</div>

<!-- FOOTER -->
<div class="rfooter">
    <div class="rfooter-logo">The 100k Parent</div>
    <p>Helping UK families earning over £100k navigate childcare costs and build family wealth</p>
    <p style="margin-top:4px;">© 2026 The 100k Parent &bull; the100kparent.com &bull; ${date}</p>
</div>

</div><!-- /report -->
</body>
</html>`;

        return html;
    }
</script>
</body>
</html>
